services:
  pdfdadi:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdfdadi:latest
    container_name: pdfdadi
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # REQUIRED in every environment (see lib/admin/session.ts). Compose will
      # refuse to start without it. Generate a long random value:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set — see .env.example}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://pdfdadi.com}
      # Optional public-tool API tuning.
      - TOOLS_MAX_CONCURRENCY=${TOOLS_MAX_CONCURRENCY:-4}
      - TOOLS_RATE_LIMIT_PER_MIN=${TOOLS_RATE_LIMIT_PER_MIN:-20}
      - TOOLS_MAX_BODY_BYTES=${TOOLS_MAX_BODY_BYTES:-115343360}
    # Persist admin content (store.json) across redeploy/restart. A named
    # volume is seeded from the image's data/admin on first attach, then keeps
    # admin edits — including the operator-set admin password — durable.
    volumes:
      - pdfdadi-data:/app/data/admin
    # Temp files are written under the OS temp dir inside the container and
    # cleaned up automatically after each job. A tmpfs keeps them in memory
    # and guarantees nothing persists.
    tmpfs:
      - /tmp
    # Network isolation for document conversion: the app attaches ONLY to an
    # internal network with no external egress. Published port 3000 still
    # accepts inbound traffic (docker-proxy forwards host->container; that is
    # inbound, not egress, and established-connection replies are allowed).
    # This blocks the LibreOffice/soffice SSRF vector — a crafted uploaded
    # document cannot make the conversion subprocess reach external or internal
    # hosts. The app has no legitimate outbound dependency today. When the AI
    # API lands (Milestone 5), add a controlled egress route for
    # api.anthropic.com rather than re-enabling broad egress. The definitive
    # per-subprocess isolation (a separate no-egress conversion worker) lands
    # with the job queue in Milestone 2.
    networks:
      - pdfdadi-internal
    restart: unless-stopped

volumes:
  pdfdadi-data:

networks:
  # Locked-down network: no external egress. Default for the app — blocks the
  # conversion SSRF vector while keeping inbound port 3000 reachable.
  pdfdadi-internal:
    internal: true
  # Uncomment (and switch the service `networks` to `pdfdadi-web`) ONLY if the
  # app needs outbound internet (e.g. after the AI API lands). Doing so re-opens
  # the conversion SSRF surface; prefer routing AI egress through a separate
  # proxy instead.
  # pdfdadi-web:
  #   driver: bridge
