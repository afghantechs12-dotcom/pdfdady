services:
  pdfdadi:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time copy of the runtime value below. `next.config.mjs` bakes the CSP
      # report-to endpoint for `/_next/static/*` from it, and that header is part of
      # the image — setting it only under `environment:` would leave the asset routes
      # reporting nowhere. Same default, so the two cannot drift silently.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pdfdadi.com}
    image: pdfdadi:latest
    container_name: pdfdadi
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # REQUIRED in every environment (see lib/admin/session.ts). Compose will
      # refuse to start without it. Generate a long random value:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set — see .env.example}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://pdfdadi.com}
      # REQUIRED: the production configuration gate refuses to start without it
      # (src/infrastructure/config/env.ts). This file previously set no value at
      # all, so `docker compose up` exited 1 before serving a single request.
      #
      # A `file:` URL because `prisma/schema.prisma` declares
      # `provider = "sqlite"`: that is the only engine this build can talk to, and
      # a `postgres://` URL is rejected by Prisma at the first query no matter what
      # the documentation says. Moving to PostgreSQL is a schema-provider change
      # and a migration rewrite, not a variable — see FINAL_PRELAUNCH_AUDIT.md.
      #
      # The path is inside a named volume, which is the point: the default
      # `file:./dev.db` would put the live database in the container's writable
      # layer and delete it on the next redeploy.
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/db/pdfdadi.db}
      # Stored documents and job outputs. Absolute and on a volume for the same
      # reason: the default `.storage/local` resolves to `/app/.storage/local`,
      # which is inside the image layer AND inside a root-owned directory the
      # uid-1001 server cannot create.
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-/app/data/storage}
      # The admin password hash and every CMS edit. It defaults to
      # `<working directory>/data/admin`, which is right here only because the
      # image's WORKDIR is /app and the volume below is mounted there — stated
      # explicitly so the variable and the mount cannot drift apart, and because
      # in a non-container deployment the same default lands inside the .next
      # build output. deploymentArtifact.test.ts pins it to the mount target.
      - ADMIN_STORE_DIR=${ADMIN_STORE_DIR:-/app/data/admin}
      # REQUIRED in production, and the reason this file has no `replicas:` and a
      # fixed `container_name` (which makes `docker compose up --scale` fail).
      # The upload rate limiter counts in one process's memory and the database is
      # single-writer SQLite, so a second instance would serve twice the upload
      # budget and contend for the same writer. The gate refuses to boot unless
      # the topology is declared; declaring it here keeps the compose file and the
      # gate from disagreeing.
      - DEPLOYMENT_TOPOLOGY=single-instance
      # Optional public-tool API tuning.
      - TOOLS_MAX_CONCURRENCY=${TOOLS_MAX_CONCURRENCY:-4}
      - TOOLS_RATE_LIMIT_PER_MIN=${TOOLS_RATE_LIMIT_PER_MIN:-20}
      - TOOLS_MAX_BODY_BYTES=${TOOLS_MAX_BODY_BYTES:-115343360}
    # Persist admin content (store.json) across redeploy/restart. A named
    # volume is seeded from the image's data/admin on first attach, then keeps
    # admin edits — including the operator-set admin password — durable.
    volumes:
      - pdfdadi-data:/app/data/admin
      # The database and the stored documents. Without these two the app boots,
      # accepts uploads, and loses every one of them — plus the whole account
      # table — on the next `docker compose up --build`.
      - pdfdadi-db:/app/data/db
      - pdfdadi-storage:/app/data/storage
    # Temp files are written under the OS temp dir inside the container and
    # cleaned up automatically after each job. A tmpfs keeps them in memory
    # and guarantees nothing persists.
    tmpfs:
      - /tmp
    # Network isolation for document conversion: the app attaches ONLY to an
    # internal network with no external egress. Published port 3000 still
    # accepts inbound traffic (docker-proxy forwards host->container; that is
    # inbound, not egress, and established-connection replies are allowed).
    # This blocks the LibreOffice/soffice SSRF vector — a crafted uploaded
    # document cannot make the conversion subprocess reach external or internal
    # hosts. The app has no legitimate outbound dependency today. When the AI
    # API lands (Milestone 5), add a controlled egress route for
    # api.anthropic.com rather than re-enabling broad egress. The definitive
    # per-subprocess isolation (a separate no-egress conversion worker) lands
    # with the job queue in Milestone 2.
    networks:
      - pdfdadi-internal
    restart: unless-stopped

volumes:
  pdfdadi-data:
  pdfdadi-db:
  pdfdadi-storage:

networks:
  # Locked-down network: no external egress. Default for the app — blocks the
  # conversion SSRF vector while keeping inbound port 3000 reachable.
  pdfdadi-internal:
    internal: true
  # Uncomment (and switch the service `networks` to `pdfdadi-web`) ONLY if the
  # app needs outbound internet (e.g. after the AI API lands). Doing so re-opens
  # the conversion SSRF surface; prefer routing AI egress through a separate
  # proxy instead.
  # pdfdadi-web:
  #   driver: bridge
